services:
  site:
    build: ./docker/php
    working_dir: /var/www
    command: php -S 0.0.0.0:8080 -t public
    environment:
      docker: "true"
    networks:
      - overlay
    ports:
      - 8080:8080
    depends_on:
      - db
    volumes:
      - .:/var/www
      - logs:/var/www/logs
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: "quick_site"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "secret"
      MYSQL_ROOT_PASSWORD: "secret"
    networks:
      - overlay
    ports:
      - "3306:3306"
    volumes:
      - my-db:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - db
    networks:
      - overlay
    ports:
      - 9191:80
    environment:
      PMA_HOST: db
      PMA_USER: user
      PMA_PASSWORD: secret

volumes:
  logs:
    driver: local
  my-db:

networks:
  overlay:
